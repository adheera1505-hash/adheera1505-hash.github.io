<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f7a56">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thaana:wght@400;700&display=swap">
<style>
:root{--bg:#f3f6f1;--surface:#ffffff;--text:#1d2a24;--muted:#5d6b63;--line:#dbe3dc;--accent:#1f7a56;--accent-text:#ffffff;--warn:#b4531a;--bad:#b3261e;--good:#1f7a56;--soft:#e6f0ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121915;--surface:#1b241f;--text:#e8efe9;--muted:#9fb0a5;--line:#2c3a32;--accent:#4fc08d;--accent-text:#0d1812;--warn:#e69a62;--bad:#f08a82;--good:#4fc08d;--soft:#22302a}}
:root[data-theme="dark"]{--bg:#121915;--surface:#1b241f;--text:#e8efe9;--muted:#9fb0a5;--line:#2c3a32;--accent:#4fc08d;--accent-text:#0d1812;--warn:#e69a62;--bad:#f08a82;--good:#4fc08d;--soft:#22302a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.5}
html[lang="dv"] body{font-family:"Noto Sans Thaana","MV Boli","Faruma","Segoe UI",system-ui,sans-serif;line-height:1.9}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.lang{display:flex;gap:4px;flex-shrink:0}
.lang button{padding:6px 12px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:700}
h1{font-size:1.7rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:4px;flex:1 1 140px}
input,select,button{font:inherit;color:var(--text)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:700;align-self:flex-end}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat small{color:var(--muted);display:block}
.stat b{font-size:1.35rem}
.good{color:var(--good)}.bad{color:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:none;background:none;border-radius:8px 8px 0 0;padding:10px 16px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--text);font-weight:700;border-bottom-color:var(--accent)}
.badge{background:var(--accent);color:var(--accent-text);border-radius:99px;padding:1px 8px;font-size:.75rem;margin-inline-start:6px}
ul{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .name{flex:1}
.cat{color:var(--muted);font-size:.8rem}
.del{padding:4px 9px;color:var(--bad)}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}
.cbar{margin-bottom:12px}
.cbar div.h{display:flex;justify-content:space-between;font-size:.92rem;gap:8px}
.tip{border-inline-start:4px solid var(--accent);background:var(--soft);padding:10px 12px;border-radius:8px;margin-bottom:10px}
.tip.warn{border-inline-start-color:var(--warn)}
.tip.bad{border-inline-start-color:var(--bad)}
.tip strong{display:block}
.empty{color:var(--muted);padding:8px 0}
.hl{font-size:1.05rem}
[hidden]{display:none!important}
.msg{padding:8px 12px;border-radius:10px;margin-bottom:8px;white-space:pre-wrap;max-width:92%}
.msg.u{background:var(--soft);margin-inline-start:auto}
.msg.a{border:1px solid var(--line)}
.chip{font-size:.85rem;padding:5px 11px;border-radius:99px}
#chatLog{max-height:420px;overflow-y:auto}
</style>
</head>
<body>
<main>
<div class="top">
<div><h1 data-i="title"></h1><p class="sub" data-i="sub"></p></div>
<div class="lang" role="group" aria-label="Language"><button id="lEn" aria-pressed="true">English</button><button id="lDv" aria-pressed="false">ދިވެހި</button></div>
</div>
<div class="panel" id="authBar">
<p id="authMsg" style="margin:0 0 8px"></p>
<div class="row" id="authForm"><input id="em" type="email" data-ip="phEmail" style="flex:1 1 220px"><button class="primary" id="signIn" style="align-self:auto" data-i="authSend"></button></div>
<button id="signOut" data-i="signOut" hidden></button>
</div>

<div class="panel">
<div class="row">
<label><span data-i="lblIncome"></span><input id="income" type="number" min="0" step="any" data-ip="phIncome"></label>
<label><span data-i="lblCur"></span><input id="cur" type="text" maxlength="5" value="MVR"></label>
</div>
</div>

<div class="panel">
<div class="row">
<label style="flex:2 1 180px"><span data-i="lblExp"></span><input id="name" type="text" data-ip="phName"></label>
<label><span data-i="lblAmt"></span><input id="amt" type="number" min="0" step="any" placeholder="0"></label>
<label><span data-i="lblCat"></span><select id="cat"></select></label>
<button class="primary" id="addBtn" data-i="addExp"></button>
</div>
</div>

<div class="stats" id="stats"></div>

<div class="tabs" role="tablist">
<button class="tab" role="tab" id="t1" aria-selected="true" data-i="tab1"></button>
<button class="tab" role="tab" id="t2" aria-selected="false"><span data-i="tab2"></span><span class="badge" id="tipCount">0</span></button>
<button class="tab" role="tab" id="t3" aria-selected="false" data-i="tab3"></button>
</div>

<section id="p1"></section>
<section id="p2" hidden></section>
<section id="p3" hidden>
<div class="panel"><div class="row">
<label style="flex:2 1 160px"><span data-i="dName"></span><input id="dn" type="text" data-ip="phDname"></label>
<label><span data-i="dType"></span><select id="dt"></select></label>
<label><span data-i="dBal"></span><input id="db" type="number" min="0" step="any"></label>
<label><span data-i="dRate"></span><input id="dr" type="number" min="0" step="any" value="15"></label>
<label><span data-i="dPay"></span><input id="dm" type="number" min="0" step="any"></label>
<label><span data-i="dStart"></span><input id="ds" type="date"></label>
<label><span data-i="dEnd"></span><input id="de" type="date"></label>
<button class="primary" id="dadd" data-i="addDebt"></button>
</div>
<div class="row" style="margin-top:10px"><label style="max-width:260px"><span data-i="dExtra"></span><input id="dx" type="number" min="0" step="any" data-ip="phExtra"></label></div>
<p class="sub" style="margin:10px 0 0;font-size:.85rem" data-i="dNote"></p></div>
<div id="dlist"></div>
<div class="panel" id="aiPanel">
<h2 style="margin:0 0 4px;font-size:1.1rem" data-i="aiTitle"></h2>
<p class="sub" style="margin:0 0 10px;font-size:.85rem" data-i="aiSub"></p>
<div id="chatLog"></div>
<div class="row" style="margin:8px 0">
<button class="chip" data-i="c1" data-qk="q1"></button>
<button class="chip" data-i="c2" data-qk="q2"></button>
<button class="chip" data-i="c3" data-qk="q3"></button>
<button class="chip" data-i="c4" data-qk="q4"></button>
</div>
<div class="row"><input id="chatIn" type="text" data-ip="phChat" style="flex:1 1 240px"><button class="primary" id="chatBtn" style="align-self:auto" data-i="send"></button></div>
</div>
</section>
</main>

tip_Bills:"ފޯނާއި އިންޓަނެޓް ޕްލޭންތައް އަޅާބަލައްވާ، ބޭނުން ނުކުރާ ސާމާނު ނިއްވާލައްވާ، އަދި ފެނާއި ކަރަންޓް ފައްސަޖެހުން ދުރުކުރައްވާ.",
tip_Health:"ޑޮކްޓަރ ހުއްދަ ދެއްވާނަމަ ޖެނެރިކް ބޭހެއް ބޭނުންކުރައްވާ، އަދި ބޮޑު ޚަރަދުތަކުން ސަލާމަތްވުމަށް ކުރިން ބެލެހެއްޓުން ކުރައްވާ.",
tip_Shopping:"ބޭނުންތެރި ނޫން ގަތުމަކުން ކުރިން 48 ގަޑިއިރު މަޑުކުރައްވާ، އަދި މަހުގެ ޝޮޕިންގް ހައްދެއް ކަނޑައަޅުއްވާ.",
tip_Entertainment:"ހިލޭ ނުވަތަ ކުޑަ ޚަރަދުގެ މަޖާތައް ހޮވާ، އަދި ބޭރުގެ ކެއުމާއި ދަތުރުތަކަށް ވަކި ބަޖެޓެއް ކަނޑައަޅުއްވާ.",
tip_Subscriptions:"ނާދިރު ބޭނުންކުރާ ސަރވިސްތައް ކެންސަލް ކުރައްވާ، ޢާއިލީ ޕްލޭންތައް ބައިވެރިވެ ބޭނުންކުރައްވާ، އަދި ތިން މަހަކު އެއްފަހަރު ބަލާލައްވާ.",
tip_Other:"މި ޚަރަދުތައް އެކެއް އެކެއްގެ ގޮތުން ބަލާލައްވާ، އަދި ކޮންތަނެއް އަންނަނިވި މަހު ދޫކުރެވޭނެތޯ ސުވާލުކުރައްވާ.",
t_noIncome:"މަހުގެ އާމްދަނީ އިތުރުކުރައްވާ",d_noIncome:"ނަސޭހަތް ދެވޭނީ އާމްދަނީއާ އަޅާބަލައިގެންނެވެ. އެހެންކަމުން މަތީގައި މަހުގެ އާމްދަނީ ލިޔުއްވާ.",
t_over:"ތިބާ {x} އިތުރަށް ޚަރަދުކުރަނީ",d_over:"ޚަރަދު އާމްދަނީއަށްވުރެ ބޮޑެވެ. ބޭނުންތެރި ނޫން ބޮޑު ޚަރަދުތައް ފުރަތަމަ ކުޑަކުރައްވާ، އަދި އާ ޚަރަދުތައް ހުއްޓުއްވާ.",
t_rate:"ތިބާގެ ސޭވިންގްސް ރޭޓް {r}% އެވެ",d_rate:"އާމްދަނީގެ 20% ({g}) ސޭވްކުރުމަކީ އާންމު މަޤްޞަދެކެވެ. އިތުރަށް {x} ބޭނުންވެއެވެ.",
t_great:"ރަނގަޅު މަސައްކަތެއް: ތިބާ އާމްދަނީގެ {r}% ސޭވްކުރަނީ",d_great:"ސޭވްކުރާ ފައިސާ ވަކި ސޭވިންގްސް އެކައުންޓެއްގައި ބަހައްޓާށެވެ. އެހެންވިއްޔާ ނޭނގި ޚަރަދުވެގެން ނުދާނެއެވެ.",
t_wants:"ބޭނުންތަކަށް އާމްދަނީގެ 30% އަށްވުރެ ގިނަ ޚަރަދުވޭ",d_wants:"ޝޮޕިންގް، މަޖާ، ސަބްސްކްރިޕްޝަންތަކާއި އެހެނިހެން ބޭނުންތަކަށް ތިބާ {w} ޚަރަދުކުރަނީ. މިއީ {g} އާ ގާތްކުރަން މަސައްކަތްކުރައްވާ.",
t_cat:"{c}: އާމްދަނީގެ {p}% (މަޤްޞަދު ގާތްގަނޑަކަށް {b}%)",d_cat:"މަހަކު {x} އާއި ހަމައަށް ސޭވްކުރެވިދާނެ. {tip}",
t_top:"ތިބާގެ އެންމެ ބޮޑު ޚަރަދަކީ {n} ({a})",d_top:"އެއީ ހަމަކަށަވަރުން ބޭނުންތެރި ޚަރަދެއްތޯ، އަދި އެއަށްވުރެ ތަނަވަސް ގޮތެއް ހުރިތޯ ވިސްނާލައްވާ.",
t_largest:"{c} އީ ތިބާގެ އެންމެ ބޮޑު ބާވަތް",t_track:"ކޮންމެ ދުވަހަކު ލިޔުއްވާ",d_track:"ކުޑަ ޚަރަދުތައް އެކުލެވި ބޮޑުވެއެވެ. ޚަރަދުކުރާ ދުވަހު ހަމަ މިތަނަށް ލިޔުއްވާ.",

hTitle:"ދަރަނި ހަމަޖެއްސުމުގެ ގޮތް",t_dti:"ދަރަނީގެ ޕޭމަންޓް އާމްދަނީގެ {r}% ނަގައެވެ",
d_dtiBad:"މިއީ ވަރަށް މަތިއެވެ. އާ ލޯނެއް ނުވަތަ ކާޑުން ޚަރަދެއް ނުކުރައްވާ، އަދި ދަރަނި އަވަހަށް ނިންމުމަށް އެހެން ޚަރަދުތައް ކުޑަކުރައްވާ.",
d_dtiWarn:"މިއީ އާންމު ރަނގަޅު ހައްދު (ގާތްގަނޑަކަށް 30%) އަށްވުރެ މަތިއެވެ. ކުޑަވަންދެން އާ ދަރަނި ނަގައިނުލައްވާ.",

const MON={en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],dv:["ޖެނުއަރީ","ފެބްރުއަރީ","މާރިޗު","އޭޕްރިލް","މޭ","ޖޫން","ޖުލައި","އޮގަސްޓް","ސެޕްޓެމްބަރު","އޮކްޓޯބަރު","ނޮވެމްބަރު","ޑިސެމްބަރު"]};

function debtPay(){return S.debts.reduce((a,d)=>a+d.pay,0)}
function tips(){
const inc=S.income,dpay=debtPay(),tot=S.items.reduce((a,x)=>a+x.amt,0)+dpay,out=[];
if(!S.items.length&&!S.debts.length)return {out,potential:0,tot};
const by={};S.items.forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amt);
if(dpay)by.Debt=dpay;
let potential=0;
if(!inc)out.push({lvl:"warn",t:t("t_noIncome"),d:t("d_noIncome")});
else{
const left=inc-tot,rate=left/inc*100;
if(left<0)out.push({lvl:"bad",t:t("t_over",{x:fmt(-left)}),d:t("d_over")});
else if(rate<20)out.push({lvl:"warn",t:t("t_rate",{r:rate.toFixed(0)}),d:t("d_rate",{g:fmt(inc*.2),x:fmt(inc*.2-left)})});
else out.push({lvl:"good",t:t("t_great",{r:rate.toFixed(0)}),d:t("d_great")});
const wants=Object.keys(by).filter(c=>!CATS[c].need).reduce((a,c)=>a+by[c],0);
if(wants>inc*.3)out.push({lvl:"warn",t:t("t_wants"),d:t("d_wants",{w:fmt(wants),g:fmt(inc*.3)})});
Object.keys(by).sort((a,b)=>by[b]-by[a]).forEach(c=>{
if(c==="Debt")return;
const lim=inc*CATS[c].bench/100;
if(by[c]>lim){const cut=by[c]-lim;potential+=cut;
out.push({lvl:"warn",t:t("t_cat",{c:cn(c),p:(by[c]/inc*100).toFixed(0),b:CATS[c].bench}),d:t("d_cat",{x:fmt(cut),tip:t("tip_"+c)})});}
});
}
const top=[...S.items].sort((a,b)=>b.amt-a.amt)[0];
if(top)out.push({lvl:"",t:t("t_top",{n:esc(top.name),a:fmt(top.amt)}),d:t("d_top")});
if(!inc){const c=Object.keys(by).sort((a,b)=>by[b]-by[a])[0];if(c&&c!=="Debt")out.push({lvl:"",t:t("t_largest",{c:cn(c)}),d:t("tip_"+c)})}
out.push({lvl:"",t:t("t_track"),d:t("d_track")});
return {out,potential,tot};
}

function plan(B,rate,P){const r=rate/1200;if(!r)return {n:Math.ceil(B/P),int:0};if(P<=r*B)return null;const n=-Math.log(1-r*B/P)/Math.log(1+r);return {n:Math.ceil(n),int:Math.max(0,n*P-B)}}
function mo(n){const y=Math.floor(n/12),m=n%12;return ((y?y+" "+t("yr")+" ":"")+(m?m+" "+t("mo"):"")).trim()||t("under1")}
function pd(s){const a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function ym(d){return MON[lang][d.getMonth()]+" "+d.getFullYear()}
function addM(n){const x=new Date();x.setDate(1);x.setMonth(x.getMonth()+n);return x}
function monthsBetween(a,b){return (b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth()}
function needPay(B,rate,n){const r=rate/1200;return r?B*r/(1-Math.pow(1+r,-n)):B/n}
function dateInfo(d){
if(!d.end)return "";
const now=new Date(),end=pd(d.end),rem=monthsBetween(now,end);let h="";
if(d.start){const st=pd(d.start),tot=monthsBetween(st,end),el=monthsBetween(st,now);if(tot>0){const pc=Math.max(0,Math.min(100,el/tot*100));h+=`<div class="bar"><i style="width:${pc}%"></i></div><span class="cat">${t("pct",{p:pc.toFixed(0)})}</span>`}}
if(rem<=0)return h+`<br><span class="bad">${t("ended")}</span>`;
const need=needPay(d.bal,d.rate,rem);
if(d.pay>=need)h+=`<br><span class="good">${t("onTrack",{d:ym(end)})}</span> ${t("afterThat",{p:fmt(d.pay),y:fmt(d.pay*12)})}`;
else h+=`<br><span class="bad">${t("needMore",{d:ym(end),n:fmt(need),x:fmt(need-d.pay)})}</span>`;
return h}
function renderDebt(){

const totB=D.reduce((a,d)=>a+d.bal,0),pay=debtPay(),yi=D.reduce((a,d)=>a+d.bal*d.rate/100,0),inc=S.income,last=D.map(d=>plan(d.bal,d.rate,d.pay)).filter(Boolean).reduce((m,p)=>Math.max(m,p.n),0);
let h=`<div class="stats"><div class="stat"><small>${t("sOwed")}</small><b>${fmt(totB)}</b></div><div class="stat"><small>${t("sMonthly")}</small><b>${fmt(pay)}</b></div><div class="stat"><small>${t("sInt")}</small><b class="bad">${fmt(yi)}</b></div><div class="stat"><small>${t("sAll")}</small><b>${last?ym(addM(last)):"-"}</b></div></div>`;
h+=`<div class="panel"><ul>`+D.map(d=>{
const p=plan(d.bal,d.rate,d.pay);let s;

else{s=t("free",{m:`<b>${mo(p.n)}</b>`,d:ym(addM(p.n)),i:fmt(p.int)});
if(ex>0){const q=plan(d.bal,d.rate,d.pay+ex);if(q)s+=`<br>`+t("extraLine",{e:fmt(ex),d:`<b class="good">${ym(addM(q.n))}</b>`,n:p.n-q.n,i:fmt(p.int-q.int),p:fmt(d.pay+ex)})}}

return `<li class="item"><span class="name"><b>${esc(d.name)}</b> <span class="cat">${esc(meta)}</span><br>${t("owedLine",{b:fmt(d.bal),p:fmt(d.pay)})}<br>${s}</span><button class="del" data-did="${d.id}">${t("del")}</button></li>`}).join("")+`</ul></div>`;
const T=[],hi=[...D].sort((a,b)=>b.rate-a.rate)[0];
if(inc){const r=pay/inc*100;
if(r>40)T.push({l:"bad",t:t("t_dti",{r:r.toFixed(0)}),d:t("d_dtiBad")});
else if(r>30)T.push({l:"warn",t:t("t_dti",{r:r.toFixed(0)}),d:t("d_dtiWarn")});
else T.push({l:"",t:t("t_dti",{r:r.toFixed(0)}),d:t("d_dtiOk")});}
else T.push({l:"warn",t:t("t_addInc"),d:t("d_addInc")});
if(D.length>1)T.push({l:"",t:t("t_aval",{n:esc(hi.name),r:hi.rate}),d:t("d_aval")});
else T.push({l:"",t:t("t_extra1",{n:esc(hi.name)}),d:t("d_extra1")});
if(D.some(d=>d.type==="Credit card"))T.push({l:"warn",t:t("t_card"),d:t("d_card")});
if(D.some(d=>d.type==="Personal loan"))T.push({l:"",t:t("t_loan"),d:t("d_loan")});
if(hi.rate>=10)T.push({l:"",t:t("t_sure"),d:t("d_sure",{r:hi.rate})});
T.push({l:"",t:t("t_stop"),d:t("d_stop")});
h+=`<div class="panel"><h2 style="margin:0 0 10px;font-size:1.1rem">${t("hTitle")}</h2>`+T.map(x=>`<div class="tip ${x.l}"><strong>${x.t}</strong>${x.d}</div>`).join("")+`</div>`;

$("dadd").onclick=()=>{

const start=$("ds").value,end=$("de").value;
if(!name){$("dn").focus();return}
if(!(bal>0)){$("db").focus();return}
if(!(rate>=0)){$("dr").focus();return}
if(!(pay>0)){$("dm").focus();return}

if(!name||!(amt>0)){(name?$("amt"):$("name")).focus();return}

const chat=[];
function ctx(){
const by={};S.items.forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amt);
return JSON.stringify({today:new Date().toISOString().slice(0,10),currency:S.cur,monthlyIncome:S.income,expensesByCategory:by,loansAndCards:S.debts.map(d=>({name:d.name,type:d.type,balance:d.bal,yearlyInterestPercent:d.rate,monthlyPayment:d.pay,startDate:d.start||null,endDate:d.end||null})),extraMonthlyPaymentUserCouldMake:S.extra||0});
}
function bubble(cls,text){const d=document.createElement("div");d.className="msg "+cls;d.textContent=text;$("chatLog").appendChild(d);d.scrollIntoView({block:"nearest"});return d}
async function callAI(prompt,onText){
const tok=session&&session.access_token;
if(!tok){const e=new Error("na");e.code="na";throw e}
const res=await fetch(CONFIG.AI_URL,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:JSON.stringify({prompt})});
const j=await res.json().catch(()=>({}));
if(!res.ok){const er=new Error(j.error||"error");er.code=res.status===429?"rate_limited":res.status===401?"not_granted":"err";throw er}
return j.text||"-";
}
async function ask(q){
if(!q||$("chatBtn").disabled)return;
$("chatIn").value="";
bubble("u",q);
const out=bubble("a",t("thinking"));
$("chatBtn").disabled=true;
try{
const hist=chat.map(m=>(m.role==="user"?"User: ":"Coach: ")+m.content).join("\n");
const prompt=`You are a friendly money coach inside a budget app used in the Maldives. Use simple, short sentences and plain words. Reply in ${lang==="dv"?"simple Dhivehi using Thaana script":"English"}, unless the user clearly writes in another language. Use the numbers in the data below and show the working in one or two lines. Give general guidance only, never invent bank rates or fees, and say to confirm exact terms with the bank when it matters. Keep each answer under 150 words, with no tables.\n\nUser budget data (JSON):\n${ctx()}\n\nConversation so far:\n${hist||"(none)"}\n\nUser: ${q}\nCoach:`;
const text=await callAI(prompt,x=>{out.textContent=x});
out.textContent=text;
chat.push({role:"user",content:q},{role:"assistant",content:text});
}catch(e){
const c=e&&e.code;
out.textContent=c==="na"?t("aiNA"):c==="not_granted"?t("aiDenied"):c==="rate_limited"?t("aiRate"):t("aiFail");
}finally{$("chatBtn").disabled=false}
}
$("chatBtn").onclick=()=>ask($("chatIn").value.trim());
$("chatIn").addEventListener("keydown",e=>{if(e.key==="Enter")ask($("chatIn").value.trim())});
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>ask(b.dataset.q));

document.querySelectorAll("[data-ip]").forEach(e=>e.placeholder=t(e.dataset.ip));

fillSel($("cat"),CATKEYS.map(k=>[k,"c_"+k]));

$("lEn").setAttribute("aria-pressed",lang==="en");$("lDv").setAttribute("aria-pressed",lang==="dv");
if(typeof authUI==="function")authUI();
render();
}

let session=null,sb=null,cloudTimer=null,loadedFor=null,authKey="authUsing",authVars={};
try{if(window.supabase&&/^https:\/\/.+\.supabase\.co/.test(CONFIG.SUPABASE_URL))sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY)}catch(e){}
function authMsg(k,v){authKey=k;authVars=v||{};$("authMsg").textContent=t(k,authVars)}
function authUI(){
if(!sb)return;
$("authForm").hidden=!!session;$("signOut").hidden=!session;
if(session&&(authKey==="authUsing"||authKey==="authIn"))authMsg("authIn",{e:session.user.email});
else if(!session&&authKey==="authIn")authMsg("authUsing");
else authMsg(authKey,authVars);
}
async function cloudSave(){
if(!sb||!session)return;
const {error}=await sb.from("budgets").upsert({user_id:session.user.id,data:S,updated_at:new Date().toISOString()});
if(error)authMsg("authSaveErr");
}
async function cloudLoad(){
const {data,error}=await sb.from("budgets").select("data").eq("user_id",session.user.id).maybeSingle();
if(error){authMsg("authLoadErr");return}
if(data&&data.data&&Object.keys(data.data).length){
S=Object.assign({income:0,cur:"MVR",items:[],debts:[],extra:0},data.data);
$("income").value=S.income||"";$("cur").value=S.cur;$("dx").value=S.extra||"";
try{localStorage.setItem("budget-v1",JSON.stringify(S))}catch(e){}
render();
}else cloudSave();
}
if(sb){
sb.auth.onAuthStateChange((ev,s)=>{
session=s;authUI();
if(s&&loadedFor!==s.user.id){loadedFor=s.user.id;setTimeout(cloudLoad,0)}
if(!s)loadedFor=null;
});
$("signIn").onclick=async()=>{
const email=$("em").value.trim();if(!email){$("em").focus();return}
const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
if(error)authMsg("authSendErr",{m:error.message});else authMsg("authCheck");
};
$("signOut").onclick=()=>sb.auth.signOut();
}else $("authBar").hidden=true;
applyLang();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
